	//https://stackoverflow.com/questions/2627473/how-to-calculate-the-number-of-days-between-two-dates
	function DaysBetween(StartDate, EndDate) {
		// The number of milliseconds in all UTC days (no DST)
		const oneDay = 1000 * 60 * 60 * 24;

		// A day in UTC always lasts 24 hours (unlike in other time formats)
		const start = Date.UTC(EndDate.getFullYear(), EndDate.getMonth(), EndDate.getDate());
		const end = Date.UTC(StartDate.getFullYear(), StartDate.getMonth(), StartDate.getDate());

		// so it's safe to divide by 24 hours
		return (start - end) / oneDay;
	}

	var pages_per_day = 2

	total_days = 600 / pages_per_day

	
	days_container = document.getElementById("previous-days")
	for (let i = 0; i < total_days; i++) {

		new_day.setDate(date.getDate() + i)

	function load_day(day) {

		buttons = document.getElementsByClassName("page-button")
		for (let i = 0; i < buttons.length; i++) {
			buttons[i].classList.remove("today")
			if (buttons[i].id == day) {
				buttons[i].classList.add("today")
			}
		}
		
		comics_container = document.getElementById("comics-container")
		comics_container.innerHTML = ""
		current_page = day * pages_per_day

		for (let i = pages_per_day; i > 0; i -= 1) {
			selected_page = (current_page+pages_per_day) - i
			comics_container.innerHTML += '<img src="' + comics[selected_page] + '">'
		}

	}

	load_day(current_day-1)
